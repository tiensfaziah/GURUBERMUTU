name: Deploy React App to cPanel

on:
  push:
    branches:
      - main # Menjalankan action ketika ada push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18 # Sesuaikan dengan versi Node lokalmu

    - name: Install Dependencies
      run: npm install

    - name: Build Project
      run: npm run build

    - name: Deploy to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./build/ # Ganti ./dist/ kalau project-mu pake Vite
        server-dir: /public_html/gurubermutu.id/ # Target folder di cPanel nanti
